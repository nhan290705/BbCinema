spring.datasource.url=jdbc:postgresql://localhost:5432/bbcinema_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


springdoc.show-login-endpoint=false

# Open the login page after a normal Main/IntelliJ launch; tests do not call Main.
bbcinema.open-browser=${BBCINEMA_OPEN_BROWSER:true}

# Add sample cinema data once by natural keys; existing records and accounts are preserved.
bbcinema.demo-data.enabled=${BBCINEMA_DEMO_DATA:true}

# Runtime images survive rebuilds and are served through /uploads/posters/.
bbcinema.media.poster-directory=${BBCINEMA_POSTER_DIR:uploads/posters}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
